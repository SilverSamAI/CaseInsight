  - id: cost_reduction
    value: "68%"
    label: "Cost Reduction"
    usage: approved_for_outbound
    guidance: "Frame as illustrative of AI-video impact, not a guarantee for the prospect."
  - id: impressions
    value: "7 billion"
    label: "Impressions"
    usage: approved_for_outbound
  - id: time_reduction
    value: "87.5%"
    label: "Time Reduction"
    usage: approved_for_outbound
  - id: content_volume
    value: "20x"
    label: "Content Volume"
    usage: approved_for_outbound
  - id: svedka_sales_lift
    value: "40%"
    label: "Svedka sales lift"
    usage: approved_for_outbound
    guidance: "Tie to the Svedka Super Bowl campaign only. Per Sam's positioning doc."

# -----------------------------------------------------------------------------
# APPROVED PROOF POINTS — pre-written, copy-ready claim blocks. Agents must use
# these verbatim or lightly trimmed; they may NOT author new factual claims.
# -----------------------------------------------------------------------------
proof_points:
  - id: coke_holiday
    text: "We helped build Coca-Cola's AI holiday campaign, which became the best-performing holiday ad in the brand's history."
    usage: approved_for_outbound
    best_for_personas: ["CMO", "VP Brand", "Chief Brand Officer", "VP Creative"]
  - id: svedka_superbowl
    text: "We created the first-ever AI Super Bowl commercial for Svedka, helping drive a 40% sales lift."
    usage: approved_for_outbound
    best_for_personas: ["CMO", "VP Marketing", "Chief Growth Officer", "VP Brand"]
  - id: client_roster
    text: "We also work with teams like Amazon, LVMH, Sam's Club, and more."
    usage: approved_for_outbound
    best_for_personas: ["all"]
  - id: brand_brain
    text: "We build 'brand brains' — living models trained on a brand's style guides, products, and creative, so teams can generate on-brand assets at scale instead of starting from scratch each campaign."
    usage: approved_for_outbound
    best_for_personas: ["Chief Digital Officer", "VP Content", "Head of Creative Operations", "Innovation Lead"]
  - id: system_not_asset
    text: "The unlock isn't one AI asset. It's the system behind it: workflows, brand guardrails, localization logic, approval paths, and templates that turn one idea into hundreds of usable assets across markets and channels."
    usage: approved_for_outbound
    best_for_personas: ["all"]

