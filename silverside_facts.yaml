  - "Strategic AI creative systems partner"
  - "Human-led, AI-powered production and workflow partner"
  - "Partner for building AI creative infrastructure"
do_not_position_as:
  - "A generic AI tool"
  - "A cheap production vendor"
  - "A simple AI video vendor"
  - "A self-serve software product"
  - "A replacement for creative teams"
  - "A gimmicky AI shop"
  - "A one-off asset generator"

forbidden_in_copy:
  - "Any client name with outbound_use != approved"
  - "Any metric not listed under metrics with usage approved_for_outbound"
  - "Any new performance number, award, or named result not in this file"
  - "Any claim about the prospect's private budget, internal priorities, or named individuals' motivations"
  - "Any 'I saw your LinkedIn post' unless the post URL is captured as a verified source"
  - "Em dashes (Sam style rule)"
